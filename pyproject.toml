[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmhubaudit"
version = "0.1.0"
description = "Audit tool for LLM hubs - check what models are available, their health, and capabilities across multiple providers."
readme = "README.md"
requires-python = ">=3.13"
license = {file = "LICENSE"}
authors = [{name = "hlsekowski"}]
keywords = ["llm", "audit", "ollama", "nvidia", "gemini", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
ollama = [
    "ollama>=0.3.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
    "black>=24.8.0",
    "mypy>=1.11.0",
    "isort>=5.13.0",
    "bandit>=1.7.0",
    "codespell>=2.3.0",
    "pre-commit>=3.7.0",
]

[project.urls]
Homepage = "https://github.com/hlsekowski/LLMhubAudit"
Repository = "https://github.com/hlsekowski/LLMhubAudit"
Issues = "https://github.com/hlsekowski/LLMhubAudit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]
exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["E501", "B008", "S101", "S105", "S106", "S107", "S311", "S603", "S607", "S608", "S609", "S701"]
fixable = ["ALL"]
unfixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["llmhubaudit"]

[tool.ruff.format]
preview = true

[tool.black]
line-length = 100
preview = true

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["llmhubaudit"]

[tool.mypy]
python_version = 3.13
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: unit tests",
    "integration: integration tests requiring external services",
    "ollama: tests requiring Ollama",
    "nvidia: tests requiring NVIDIA API",
    "gemini: tests requiring Gemini API",
]
addopts = ["--strict-markers"]
filterwarnings = ["error::DeprecationWarning", "error::PendingDeprecationWarning"]
asyncio_default_fixture_loop_scope = "function"
